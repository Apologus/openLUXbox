<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openLUXbox - Multi-Game Flasher</title>
    <!-- CryptoJS für MD5 Checksummen beim ESP-Flashen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --card-hover: #26262c;
            --accent: #00d26a;
            --accent-disabled: #2a5e42;
            --text: #f0f0f0;
            --text-muted: #8c8c9a;
            --border: #2f2f38;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-group img {
            height: 48px;
            border-radius: 8px;
        }
        .btn-flash {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-flash:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .btn-flash:disabled {
            background-color: var(--accent-disabled);
            color: #666;
            cursor: not-allowed;
        }
        .status-container {
            width: 100%;
            max-width: 950px;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 8px;
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.1s linear;
        }
        .status-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .slot-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }
        .main-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            width: 100%;
            max-width: 950px;
        }
        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
        }
        .game-item:hover {
            background-color: var(--card-hover);
        }
        .game-item.active {
            border-color: var(--accent);
        }
        .game-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .game-item-title {
            font-size: 1.05rem;
            font-weight: 600;
            flex-grow: 1;
        }
        .preview-pane {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .preview-pane img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            background-color: #0c0c0e;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .preview-pane h2 {
            font-size: 1.4rem;
        }
        .preview-pane p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <img src="openLUXbox.png" alt="Logo" onerror="this.style.display='none'">
            <div>
                <h1>openLUXbox</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Multi-Game Flasher</p>
            </div>
        </div>
        <div>
            <button id="flashBtn" class="btn-flash" onclick="startFlashProcess()">Spiele Flashen</button>
        </div>
    </header>

    <div class="status-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="statusText" class="status-text">Wähle bis zu 3 Spiele aus.</div>
            <div id="slotIndicator" class="slot-indicator">0 / 3 Slots belegt</div>
        </div>
        <div id="progressBar" class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="games-list" id="gamesList"></div>
        <div class="preview-pane" id="previewPane">
            <img id="previewImg" src="openLUXbox.png" alt="Preview">
            <h2 id="previewTitle">Spielübersicht</h2>
            <p id="previewDesc">Wähle ein Spiel aus der Liste, um Details anzuzeigen.</p>
        </div>
    </div>

    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.5.4/bundle.js";

        const games = [
  {
    "id": "4Pong",
    "title": "4PONG",
    "name16": "4PONG",
    "bin": "firmware/4Pong/4Pong.bin",
    "image": "firmware/4Pong/4Pong.jpg",
    "description": "Keine Beschreibung vorhanden."
  },
  {
    "id": "Frog",
    "title": "FROG",
    "name16": "FROG",
    "bin": "firmware/Frog/Frog.bin",
    "image": "firmware/Frog/Frog.jpg",
    "description": "Keine Beschreibung vorhanden."
  },
  {
    "id": "Lux",
    "title": "LUX",
    "name16": "LUX",
    "bin": "firmware/Lux/Lux.bin",
    "image": "firmware/Lux/Lux.jpg",
    "description": "Keine Beschreibung vorhanden."
  },
  {
    "id": "Nano Hexagon",
    "title": "NANO HEXAGON",
    "name16": "NANO HEXAGON",
    "bin": "firmware/Nano Hexagon/Nano Hexagon.bin",
    "image": "firmware/Nano Hexagon/Nano Hexagon.jpg",
    "description": "Keine Beschreibung vorhanden."
  },
  {
    "id": "Snake",
    "title": "SNAKE",
    "name16": "SNAKE",
    "bin": "firmware/Snake/Snake.bin",
    "image": "firmware/Snake/Snake.jpg",
    "description": "Keine Beschreibung vorhanden."
  },
  {
    "id": "canoLbalt",
    "title": "CANOLBALT",
    "name16": "CANOLBALT",
    "bin": "firmware/canoLbalt/canoLbalt.bin",
    "image": "firmware/canoLbalt/canoLbalt.jpg",
    "description": "Keine Beschreibung vorhanden."
  }
];
        const MAX_SLOTS = 3;
        let selectedGames = [];

        function initUI() {
            const listEl = document.getElementById('gamesList');
            listEl.innerHTML = '';

            games.forEach((g, idx) => {
                const item = document.createElement('div');
                item.className = 'game-item' + (idx === 0 ? ' active' : '');
                item.onclick = (e) => {
                    if (e.target.type !== 'checkbox') {
                        showPreview(g);
                        document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                    }
                };

                const chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.id = 'chk_' + g.id;
                chk.onchange = () => toggleGame(g, chk);

                const label = document.createElement('label');
                label.className = 'game-item-title';
                label.htmlFor = 'chk_' + g.id;
                label.innerText = g.title;

                item.appendChild(chk);
                item.appendChild(label);
                listEl.appendChild(item);
            });

            if (games.length > 0) showPreview(games[0]);
            updateSlotIndicator();
        }

        function showPreview(g) {
            document.getElementById('previewTitle').innerText = g.title;
            document.getElementById('previewDesc').innerText = g.description;
            document.getElementById('previewImg').src = g.image;
        }

        function toggleGame(game, chk) {
            if (chk.checked) {
                if (selectedGames.length >= MAX_SLOTS) {
                    chk.checked = false;
                    alert('Maximal 3 Spiele können gleichzeitig auf der openLUXbox installiert werden!');
                    return;
                }
                selectedGames.push(game);
            } else {
                selectedGames = selectedGames.filter(g => g.id !== game.id);
            }

            updateSlotIndicator();
        }

        function updateSlotIndicator() {
            const count = selectedGames.length;
            document.getElementById('slotIndicator').innerText = `${count} / ${MAX_SLOTS} Slots belegt`;
            document.getElementById('flashBtn').disabled = (count === 0);
        }

        function createConfigBinary(selected) {
            const buffer = new Uint8Array(256);
            // Magic: 'O','L','B','X' (0x4F4C4258)
            buffer[0] = 0x58; buffer[1] = 0x42; buffer[2] = 0x4C; buffer[3] = 0x4F;
            buffer[4] = selected.length;

            for (let i = 0; i < selected.length; i++) {
                const offsetName = 5 + (i * 16);
                const str = selected[i].name16;
                for (let c = 0; c < Math.min(str.length, 15); c++) {
                    buffer[offsetName + c] = str.charCodeAt(c);
                }
                buffer[offsetName + 15] = 0; // Null-terminiert
            }

            const offsetSlots = 5 + (3 * 16);
            for (let i = 0; i < selected.length; i++) {
                buffer[offsetSlots + i] = i + 1; // Slot 1, 2, 3
            }

            let binaryStr = '';
            for (let i = 0; i < buffer.length; i++) {
                binaryStr += String.fromCharCode(buffer[i]);
            }
            return binaryStr;
        }

        async function fetchBinary(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Datei konnte nicht geladen werden: ${url}`);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsBinaryString(blob);
            });
        }

        window.startFlashProcess = async function() {
            if (selectedGames.length === 0) return;

            const flashBtn = document.getElementById('flashBtn');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            flashBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            statusText.innerText = 'Verbinde mit openLUXbox... Bitte Port wählen!';

            try {
                const port = await navigator.serial.requestPort();
                const transport = new Transport(port);

                const esploader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => {},
                        writeLine: (data) => console.log(data),
                        write: (data) => console.log(data)
                    }
                });

                await esploader.main();

                statusText.innerText = 'Lade Binaries herunter...';

                const fileArray = [];

                // 1. Menü auf 0x000000
                const menuData = await fetchBinary('firmware/menu/menu.bin');
                fileArray.push({ data: menuData, address: 0x000000 });

                // 2. Gewählte Spiele auf Slot 1, 2, 3
                const slotOffsets = [0x100000, 0x200000, 0x300000];
                for (let i = 0; i < selectedGames.length; i++) {
                    const gameData = await fetchBinary(selectedGames[i].bin);
                    fileArray.push({ data: gameData, address: slotOffsets[i] });
                }

                // 3. Flash-Config auf 0x3FC000
                const configData = createConfigBinary(selectedGames);
                fileArray.push({ data: configData, address: 0x3FC000 });

                statusText.innerText = 'Flashe openLUXbox...';

                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: '4MB',
                    flashMode: 'dio',
                    flashFreq: '40m',
                    eraseAll: false,
                    compress: true,
                    calculateMD5Hash: (image) => CryptoJS.MD5(CryptoJS.enc.Latin1.parse(image)).toString(),
                    reportProgress: (fileIndex, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressFill.style.width = percent + '%';
                        statusText.innerText = `Flashe Teil ${fileIndex + 1}/${fileArray.length}: ${percent}%`;
                    }
                });

                statusText.innerText = '✅ Erfolgreich geflasht! openLUXbox startet neu...';
                await esploader.after('hard_reset');
                await transport.disconnect();
            } catch (err) {
                console.error(err);
                statusText.innerText = '❌ Fehler: ' + err.message;
            } finally {
                flashBtn.disabled = false;
            }
        };

        initUI();
    </script>
</body>
</html>
