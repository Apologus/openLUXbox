<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openLUXbox - Multi-Game Flasher</title>
    <!-- ESP Web Tools Loader & esptool-js -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <script src="https://unpkg.com/esptool-js@0.4.3/bundle.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00bcd4;
            --accent-hover: #00acc1;
            --disabled-color: #555;
            --border-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
        }
        .header img {
            max-height: 90px;
            margin-bottom: 10px;
        }
        .top-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .slot-indicator {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn-flash {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-flash:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }
        .btn-flash:disabled {
            background-color: var(--disabled-color);
            color: #888;
            cursor: not-allowed;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .game-list {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            max-height: 480px;
            overflow-y: auto;
        }
        .game-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            transition: background 0.2s;
        }
        .game-item:hover {
            background: rgba(255,255,255,0.07);
        }
        .game-item.active {
            background: rgba(0, 188, 212, 0.15);
            border-left: 4px solid var(--accent-color);
        }
        .game-item input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            cursor: pointer;
        }
        .game-item label {
            cursor: pointer;
            flex-grow: 1;
            font-weight: 500;
        }
        .preview-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .preview-card img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .preview-card h2 {
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }
        .preview-card p {
            line-height: 1.5;
            color: #bbb;
        }
        #progress-box {
            width: 100%;
            max-width: 900px;
            margin-top: 15px;
            display: none;
        }
        .progress-bar-bg {
            background: #2a2a2a;
            border-radius: 6px;
            height: 14px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .progress-bar-fill {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.1s;
        }
        #status-text {
            font-size: 0.9rem;
            color: #aaa;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="openLUXbox.png" alt="openLUXbox Logo">
        <h1>openLUXbox Multi-Game Installer</h1>
    </div>

    <div class="top-bar">
        <div class="slot-indicator">
            Ausgewählt: <span id="selected-count" style="color: var(--accent-color);">0</span> / 3 Spiele
        </div>
        <button id="flash-button" class="btn-flash" disabled onclick="startMultiFlash()">Flashen</button>
    </div>

    <div id="progress-box">
        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div id="status-text">Bereit.</div>
    </div>

    <div class="container">
        <!-- Spiele Liste Links -->
        <div class="game-list" id="game-list"></div>

        <!-- Detailansicht Rechts -->
        <div class="preview-card" id="preview-card">
            <img id="preview-img" src="openLUXbox.png" alt="Preview">
            <h2 id="preview-title">Wähle ein Spiel</h2>
            <p id="preview-desc">Klicke auf ein Spiel in der Liste, um Details zu sehen, und setze den Haken, um es auf die openLUXbox zu laden.</p>
        </div>
    </div>

    <script>
        const GAMES = [
  {
    "id": "4Pong",
    "title": "4Pong",
    "displayTitle": "4PONG",
    "bin": "firmware/4Pong/4Pong.bin",
    "image": "firmware/4Pong/4Pong.jpg",
    "description": "openLUXbox Game: 4Pong"
  },
  {
    "id": "Frog",
    "title": "Frog",
    "displayTitle": "FROG",
    "bin": "firmware/Frog/Frog.bin",
    "image": "firmware/Frog/Frog.jpg",
    "description": "openLUXbox Game: Frog"
  },
  {
    "id": "Lux",
    "title": "Lux",
    "displayTitle": "LUX",
    "bin": "firmware/Lux/Lux.bin",
    "image": "firmware/Lux/Lux.jpg",
    "description": "openLUXbox Game: Lux"
  },
  {
    "id": "Nano Hexagon",
    "title": "Nano Hexagon",
    "displayTitle": "NANO HEXAGON",
    "bin": "firmware/Nano Hexagon/Nano Hexagon.bin",
    "image": "firmware/Nano Hexagon/Nano Hexagon.jpg",
    "description": "openLUXbox Game: Nano Hexagon"
  },
  {
    "id": "Snake",
    "title": "Snake",
    "displayTitle": "SNAKE",
    "bin": "firmware/Snake/Snake.bin",
    "image": "firmware/Snake/Snake.jpg",
    "description": "openLUXbox Game: Snake"
  },
  {
    "id": "canoLbalt",
    "title": "Canolbalt",
    "displayTitle": "CANOLBALT",
    "bin": "firmware/canoLbalt/canoLbalt.bin",
    "image": "firmware/canoLbalt/canoLbalt.jpg",
    "description": "openLUXbox Game: Canolbalt"
  }
];
        const MAX_SLOTS = 3;
        let selectedGames = [];

        function initUI() {
            const listEl = document.getElementById('game-list');
            listEl.innerHTML = '';

            GAMES.forEach((game, index) => {
                const item = document.createElement('div');
                item.className = 'game-item' + (index === 0 ? ' active' : '');
                item.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') showPreview(index);
                };

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = 'cb-' + game.id;
                cb.onchange = (e) => toggleGame(game, e.target);

                const label = document.createElement('label');
                label.htmlFor = 'cb-' + game.id;
                label.innerText = game.title;

                item.appendChild(cb);
                item.appendChild(label);
                listEl.appendChild(item);
            });

            if (GAMES.length > 0) showPreview(0);
        }

        function showPreview(index) {
            const game = GAMES[index];
            document.getElementById('preview-img').src = game.image;
            document.getElementById('preview-title').innerText = game.title;
            document.getElementById('preview-desc').innerText = game.description;

            document.querySelectorAll('.game-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        function toggleGame(game, checkbox) {
            if (checkbox.checked) {
                if (selectedGames.length >= MAX_SLOTS) {
                    checkbox.checked = false;
                    alert('Maximal 3 Spiele gleichzeitig möglich!');
                    return;
                }
                selectedGames.push(game);
            } else {
                selectedGames = selectedGames.filter(g => g.id !== game.id);
            }

            updateSlotStatus();
        }

        function updateSlotStatus() {
            const countEl = document.getElementById('selected-count');
            countEl.innerText = selectedGames.length;

            const btn = document.getElementById('flash-button');
            btn.disabled = (selectedGames.length === 0);

            // Alle nicht gewählten Checkboxen deaktivieren, wenn voll
            document.querySelectorAll('.game-item input[type="checkbox"]').forEach(cb => {
                if (!cb.checked) {
                    cb.disabled = (selectedGames.length >= MAX_SLOTS);
                }
            });
        }

        // Config-Array für 0x3FC000 erzeugen
        function createConfigBinary(chosenGames) {
            const buffer = new ArrayBuffer(256);
            const view = new DataView(buffer);
            const bytes = new Uint8Array(buffer);

            // Magic: 'OLBX' (0x4F4C4258 Little Endian)
            view.setUint32(0, 0x4F4C4258, true);
            view.setUint8(4, chosenGames.length);

            chosenGames.forEach((g, i) => {
                // Slot 1, 2, 3
                view.setUint8(5 + (3 * 16) + i, i + 1);
                // Name (max 15 Zeichen + Nullbyte)
                const nameStr = g.displayTitle.substr(0, 15);
                for (let c = 0; c < nameStr.length; c++) {
                    bytes[5 + (i * 16) + c] = nameStr.charCodeAt(c);
                }
            });

            return new Uint8Array(buffer);
        }

        async function fetchBinary(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Konnte Datei nicht laden: ' + url);
            const buf = await res.arrayBuffer();
            return new Uint8Array(buf);
        }

        async function startMultiFlash() {
            const progressBox = document.getElementById('progress-box');
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');
            const flashBtn = document.getElementById('flash-button');

            try {
                flashBtn.disabled = true;
                progressBox.style.display = 'block';
                statusText.innerText = 'Verbinde mit openLUXbox (Web Serial)...';

                const transport = new esptooljs.Transport(await navigator.serial.requestPort());
                const esploader = new esptooljs.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    romBaudrate: 115200
                });

                await esploader.main();
                statusText.innerText = 'Lade Binaries herunter...';

                const fileArray = [];
                // 1. Menu Bootloader auf Slot 0
                const menuData = await fetchBinary('firmware/menu/menu.bin');
                fileArray.push({ data: menuData, address: 0x000000 });

                // 2. Gewählte Spiele auf Slot 1, 2, 3
                const slotOffsets = [0x100000, 0x200000, 0x300000];
                for (let i = 0; i < selectedGames.length; i++) {
                    const gameData = await fetchBinary(selectedGames[i].bin);
                    fileArray.push({ data: gameData, address: slotOffsets[i] });
                }

                // 3. Flash-Config auf 0x3FC000
                const configData = createConfigBinary(selectedGames);
                fileArray.push({ data: configData, address: 0x3FC000 });

                statusText.innerText = 'Flashe openLUXbox...';

                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: 'keep',
                    flashMode: 'keep',
                    flashFreq: 'keep',
                    eraseAll: false,
                    calculateMD5Hash: (image) => CryptoJS.MD5(CryptoJS.lib.ByteArray(image)).toString(),
                    onProgress: (fileIndex, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressFill.style.width = percent + '%';
                        statusText.innerText = `Flashe Slot ${fileIndex + 1}/${fileArray.length}: ${percent}%`;
                    }
                });

                statusText.innerText = '✅ Erfolgreich geflasht! openLUXbox startet neu...';
                await esploader.hardReset();
                await transport.disconnect();
            } catch (err) {
                console.error(err);
                statusText.innerText = '❌ Fehler: ' + err.message;
            } finally {
                flashBtn.disabled = false;
            }
        }

        window.onload = initUI;
    </script>
</body>
</html>
